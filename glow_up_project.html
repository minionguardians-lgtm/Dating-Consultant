  <style>
    :root {
      --bg: #1A1A2E;
      --header-bg: #16213E;
      --pink: #FF4B7B;
      --yellow: #FFD93D;
      --green: #6BCB77;
      --blue: #4D9DE0;
      --text: #E8E8F0;
      --muted: #8888A8;
      --card-bg: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--header-bg);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 18px;
      background: linear-gradient(135deg, var(--pink), var(--yellow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sync-indicator {
      margin-left: auto;
      font-size: 10px;
      padding: 3px 10px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity .3s;
      font-family: 'DM Sans', sans-serif;
    }
    .sync-indicator.show { opacity: 1; }
    .sync-indicator.syncing { background: rgba(255,217,61,.15); color: var(--yellow); }
    .sync-indicator.saved   { background: rgba(107,203,119,.15); color: var(--green); }
    .sync-indicator.error   { background: rgba(255,75,123,.15);  color: var(--pink); }

    /* TABS */
    .tabs-bar {
      background: var(--header-bg);
      padding: 0 16px;
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tabs-bar::-webkit-scrollbar { height: 3px; }
    .tabs-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .tab-btn {
      padding: 10px 16px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color .2s, border-color .2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--pink); }
    .tab-btn.demo-tab { color: #FFD93D88; }
    .tab-btn.demo-tab.active { color: var(--yellow); border-bottom-color: var(--yellow); }
    .teacher-badge {
      background: var(--yellow);
      color: #1A1A2E;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 8px;
    }

    /* LOADING */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 16px;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* MAIN LAYOUT */
    #appContent { min-height: calc(100vh - 56px - 40px); }

    .edit-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 680px) {
      .edit-layout { grid-template-columns: 1fr; }
      .phone-col { display: none; }
    }

    /* PHONE PREVIEW */
    .phone-col {
      position: sticky;
      top: 108px;
      height: fit-content;
    }

    .phone-frame {
      background: #0d0d1a;
      border-radius: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
      max-width: 280px;
      margin: 0 auto;
    }

    .phone-screen {
      border-radius: 26px;
      overflow: hidden;
      background: #1a1a2e;
    }

    .phone-photo-area {
      position: relative;
      height: 280px;
      overflow: hidden;
    }

    .phone-photo-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 10px;
    }

    .slide-dots {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
    }
    .slide-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.4); }
    .slide-dot.active { background: white; }

    .phone-info {
      padding: 14px;
    }

    .phone-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 18px;
    }

    .phone-bio {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
      min-height: 40px;
    }

    .phone-tags {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .phone-tag {
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 10px;
    }

    .phone-actions {
      display: flex;
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
    }
    .phone-btn {
      flex: 1;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: default;
    }
    .phone-btn.x-btn { background: rgba(255,75,123,0.15); color: var(--pink); }
    .phone-btn.heart-btn { background: rgba(107,203,119,0.15); color: var(--green); }

    /* CARDS */
    .cards-col { display: flex; flex-direction: column; gap: 20px; }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-header-left { border-left-width: 4px; border-left-style: solid; }
    .card-pink  { border-left-color: var(--pink); }
    .card-yellow { border-left-color: var(--yellow); }
    .card-green  { border-left-color: var(--green); }
    .card-blue   { border-left-color: var(--blue); }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
    }
    .card-role {
      font-size: 11px;
      color: var(--muted);
      margin-left: auto;
    }

    .card-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    /* PHOTO SLOTS */
    .photo-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    .photo-slot {
      position: relative;
      aspect-ratio: 3/4;
      border-radius: 12px;
      border: 2px dashed var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: border-color .2s;
    }
    .photo-slot:hover { border-color: var(--pink); }
    .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
    .photo-slot input { display: none; }
    .photo-slot-icon { font-size: 24px; opacity: .4; }
    .photo-slot-text { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .photo-delete {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.7);
      border: none;
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* TEXTAREA */
    label.field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .textarea-wrap { position: relative; }
    textarea {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 12px;
      resize: vertical;
      line-height: 1.6;
      transition: border-color .2s;
    }
    textarea:focus { outline: none; border-color: rgba(255,255,255,0.3); }
    .char-count {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 10px;
      color: var(--muted);
      pointer-events: none;
    }

    .readonly-bio {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* TIP INPUTS */
    .tip-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .tip-num {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 20px;
      min-width: 24px;
      line-height: 1.2;
    }
    .tip-num.pink { color: var(--pink); }
    .tip-num.yellow { color: var(--yellow); }
    .tip-num.green { color: var(--green); }
    .tip-wrap { flex: 1; position: relative; }

    /* HINT */
    .hint-text {
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
    }

    /* SAVE BTN */
    .save-btn-wrap { padding: 0 24px 24px; }
    .save-btn {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      display: block;
      padding: 16px 32px;
      background: linear-gradient(135deg, var(--pink), #c9336a);
      border: none;
      border-radius: 14px;
      color: white;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, opacity .2s;
      box-shadow: 0 4px 20px rgba(255,75,123,0.35);
    }
    .save-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,75,123,0.45); }
    .save-btn:active { transform: translateY(0); }
    .save-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* PREVIEW SCREEN */
    .preview-screen { padding: 24px; max-width: 900px; margin: 0 auto; }

    .preview-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }

    .back-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      transition: background .2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); }

    .preview-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 20px;
    }

    .published-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .pub-tab {
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      transition: all .2s;
    }
    .pub-tab.active, .pub-tab:hover { background: rgba(255,75,123,0.15); border-color: var(--pink); color: var(--text); }

    .no-published {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 15px;
    }

    /* PROFILE CARD */
    .profile-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 680px) {
      .profile-grid { grid-template-columns: 1fr; }
    }

    .preview-phone-frame {
      background: #0d0d1a;
      border-radius: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      max-width: 260px;
      margin: 0 auto;
    }

    .preview-phone-screen {
      border-radius: 26px;
      overflow: hidden;
      background: #1a1a2e;
    }

    .preview-photo-area {
      position: relative;
      height: 260px;
      overflow: hidden;
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .preview-photo-area img { width: 100%; height: 100%; object-fit: cover; }

    /* ADVISOR PANELS */
    .advisor-panels { display: flex; flex-direction: column; gap: 16px; }

    .advisor-panel {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .advisor-panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      border-left-width: 4px;
      border-left-style: solid;
    }

    .advisor-panel-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 14px;
    }

    .advisor-panel-body {
      padding: 16px 18px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
    }

    .advisor-panel-body.has-content { color: var(--text); }

    .tip-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .tip-item { display: flex; align-items: flex-start; gap: 10px; }
    .tip-num-small {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 16px;
      min-width: 18px;
    }
  </style>
</head>

  el.className = "sync-indicator show " + type;
  el.textContent = msg;
  clearTimeout(syncTimer);
  if (type === "saved") {
    syncTimer = setTimeout(() => { el.className = "sync-indicator"; }, 2000);
  }
}

// ===== FIREBASE =====
async function compressImage(dataURL, maxWidth=800) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxWidth / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", 0.6));
    };
    img.src = dataURL;
  });
}

async function saveToFirebase(groupName) {
  showSync("syncing", "Saving...");
  const key = groupName.replace(/ /g, "_");
  const le = localEdits[groupName];
  const compressedPhotos = await Promise.all(
    (le.photos || [null,null,null]).map(p => p ? compressImage(p) : Promise.resolve(null))
  );
  const data = {
    photoStrategy: le.photoStrategy,
    improvedBio:   le.improvedBio,
    bioStrategy:   le.bioStrategy,
    tips:          le.tips,
    finalDecision: le.finalDecision,
    screen:        "preview",
    updatedAt:     Date.now(),
    photos:        compressedPhotos
  };
  try {
    await db.ref("groups/" + key).set(data);
    remoteState[groupName] = Object.assign({}, data);
    localEdits[groupName]  = Object.assign({}, data);
    showSync("saved", "✓ Saved");
  } catch(e) {
    console.error(e);
    showSync("error", "⚠ Save failed");
  }
}

function startListening() {
  db.ref("groups").on("value", snapshot => {
    const data = snapshot.val() || {};
    GROUPS.forEach(g => {
      const key = g.replace(/ /g, "_");
      if (data[key]) {
        remoteState[g] = Object.assign(defaultState(), data[key]);
        if (!remoteState[g].photos) remoteState[g].photos = [null,null,null];
        if (localEdits[g].updatedAt === 0) {
          localEdits[g] = Object.assign({}, remoteState[g]);
          localEdits[g].photos = (remoteState[g].photos || []).slice();
        }
      }
    });
    render();
  }, error => {
    document.getElementById("appContent").innerHTML =
      `<div class="loading-screen"><div style="color:var(--pink)">⚠ Firebase error: ${error.message}</div></div>`;
  });
}

// ===== RENDER =====
function render() {
  const g = currentGroup;
  const le = localEdits[g];
  const isEditScreen = le.screen !== "preview";

  // tabs
  const tabsBar = document.getElementById("tabsBar");
  tabsBar.innerHTML = GROUPS.map(name => {
    const isDemo = name === "Demo";
    return `<button class="tab-btn ${isDemo ? "demo-tab" : ""} ${name === g ? "active" : ""}"
      onclick="switchGroup('${name}')">${name}${isDemo ? `<span class="teacher-badge">Teacher</span>` : ""}</button>`;
  }).join("");

  const content = document.getElementById("appContent");
  if (isEditScreen) {
    content.innerHTML = renderEditScreen(g);
  } else {
    content.innerHTML = renderPreviewScreen(g);
  }
  attachEvents(g, isEditScreen);
}

function renderPhotoSlot(g, i) {

      <button class="photo-delete" onclick="deletePhoto(${i})">✕</button>
    </div>`;
  }
  return `<div class="photo-slot" onclick="document.getElementById('photoInput${i}').click()">
    <span class="photo-slot-icon">📷</span>
    <span class="photo-slot-text">Photo ${i+1}</span>
    <input type="file" id="photoInput${i}" accept="image/*" onchange="handlePhoto(event,${i})">
  </div>`;
}

// ===== PREVIEW SCREEN =====
function renderPreviewScreen(g) {
  const published = GROUPS.filter(gr => remoteState[gr].screen === "preview");
  if (previewViewingGroup === null || !published.includes(previewViewingGroup)) {
    previewViewingGroup = published.length > 0 ? published[0] : null;
  }

  const tabsHTML = published.map(gr => `
    <button class="pub-tab ${gr === previewViewingGroup ? "active" : ""}" onclick="setPreviewGroup('${gr}')">${gr}</button>
  `).join("");

  let profileHTML = `<div class="no-published">No published profiles yet — be the first! 🚀</div>`;

  if (previewViewingGroup) {
    const pvg = previewViewingGroup;
    const pvState = remoteState[pvg];
    const pvPhotos = (remoteState[pvg].photos || []).filter(Boolean);

    let photoAreaHTML;
    if (pvPhotos.length === 0) {
      photoAreaHTML = `<span>👤</span>`;
    } else if (pvPhotos.length === 1) {
      photoAreaHTML = `<img src="${pvPhotos[0]}" alt="After photo">`;
    } else {
      const dots = pvPhotos.map((_, idx) => `<div class="slide-dot ${idx===0?'active':''}" onclick="slidePhoto('${pvg}',${idx})"></div>`).join("");
      photoAreaHTML = `
        <div id="slider-${pvg.replace(/ /g,'_')}" style="position:relative;width:100%;height:100%">
          ${pvPhotos.map((p,idx) => `<img src="${p}" alt="After photo ${idx+1}" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:${idx===0?1:0};transition:opacity .3s">`).join("")}
          <div class="slide-dots">${dots}</div>
        </div>`;
    }

    const tips = (pvState.tips || []).filter(t => t && t.trim());
    const tipsHTML = tips.length > 0
      ? `<ul class="tip-list">${tips.map((t, i) => {
          const cols = ["var(--pink)","var(--yellow)","var(--green)"];
          return `<li class="tip-item"><span class="tip-num-small" style="color:${cols[i]}">${i+1}</span><span>${escHtml(t)}</span></li>`;
        }).join("")}</ul>`
      : `<span>—</span>`;

    const bioDisplay = pvState.improvedBio || DEFAULT_BIO;

    profileHTML = `
    <div class="profile-grid">
      <div>
        <div class="preview-phone-frame">
          <div class="preview-phone-screen">
            <div class="preview-photo-area">${photoAreaHTML}</div>
            <div class="phone-info">
              <div class="phone-name">Kenji, 21</div>
              <div class="phone-bio">${escHtml(bioDisplay)}</div>
              <div class="phone-tags">
                <span class="phone-tag">☕ Coffee</span>
                <span class="phone-tag">🏋️ Gym</span>
                <span class="phone-tag">🍜 Foodie</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="advisor-panels">
        ${renderAdvisorPanel("📸 Photo Strategy", "var(--pink)", pvState.photoStrategy, "Photo Specialist")}
        ${renderAdvisorPanel("✏️ Bio Strategy", "var(--yellow)", pvState.bioStrategy, "Bio Specialist")}
        <div class="advisor-panel">
          <div class="advisor-panel-header card-header-left" style="border-left-color:var(--green)">
            <span>💌 Date Advice</span>
            <span class="card-title advisor-panel-title" style="margin-left:8px">First Chat & Date Advice</span>
            <span class="card-role" style="margin-left:auto;font-size:11px;color:var(--muted)">Dating Advisor</span>
          </div>
          <div class="advisor-panel-body ${tips.length > 0 ? "has-content" : ""}">
            ${tipsHTML}

}

function renderAdvisorPanel(label, color, content, role) {
  const hasContent = content && content.trim();
  return `
  <div class="advisor-panel">
    <div class="advisor-panel-header card-header-left" style="border-left-color:${color}">
      <span class="advisor-panel-title">${label}</span>
      <span class="card-role" style="margin-left:auto;font-size:11px;color:var(--muted)">${role}</span>
    </div>
    <div class="advisor-panel-body ${hasContent ? "has-content" : ""}">
      ${hasContent ? escHtml(content) : "—"}
    </div>
  </div>`;
}

// ===== EVENTS =====
function attachEvents(g, isEdit) {
  if (!isEdit) return;
  const le = localEdits[g];

  // Photo strategy
  const psTA = document.getElementById("photoStrategyTA");
  if (psTA) {
    psTA.addEventListener("input", () => {
      le.photoStrategy = psTA.value;
      document.getElementById("psCount").textContent = psTA.value.length + "/300";
    });
  }

  // Improved Bio (with live preview)
  const ibTA = document.getElementById("improvedBioTA");
  if (ibTA) {
    ibTA.addEventListener("input", () => {
      le.improvedBio = ibTA.value;
      document.getElementById("ibCount").textContent = ibTA.value.length + "/300";
      const preview = document.getElementById("phoneBioPreview");
      if (preview) preview.textContent = ibTA.value || DEFAULT_BIO;
    });
  }

  // Bio strategy
  const bsTA = document.getElementById("bioStrategyTA");
  if (bsTA) {
    bsTA.addEventListener("input", () => {
      le.bioStrategy = bsTA.value;
      document.getElementById("bsCount").textContent = bsTA.value.length + "/200";
    });
  }

  // Tips
  [0,1,2].forEach(i => {
    const ta = document.getElementById(`tip${i}TA`);
    if (ta) {
      ta.addEventListener("input", () => {
        le.tips[i] = ta.value;
        document.getElementById(`tip${i}Count`).textContent = ta.value.length + "/140";
      });
    }
  });

  // Final decision
  const fdTA = document.getElementById("finalDecisionTA");
  if (fdTA) {
    fdTA.addEventListener("input", () => {
      le.finalDecision = fdTA.value;
      document.getElementById("fdCount").textContent = fdTA.value.length + "/400";
    });
  }

  // Save button
  const saveBtn = document.getElementById("saveBtn");
  if (saveBtn) {
    saveBtn.addEventListener("click", async () => {
      saveBtn.disabled = true;
      localEdits[g].screen = "preview";
      await saveToFirebase(g);
      render();
    });
  }
}

// ===== ACTIONS =====
function switchGroup(name) {
  currentGroup = name;
  previewViewingGroup = null;
  render();
}

function setPreviewGroup(name) {
  previewViewingGroup = name;
  render();
}

function goBackToEdit() {
  localEdits[currentGroup].screen = "edit";
  render();
}

function handlePhoto(event, i) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    if (!localEdits[currentGroup].photos) localEdits[currentGroup].photos = [null,null,null];
    localEdits[currentGroup].photos[i] = e.target.result;
    // update phone preview immediately
    const phoneImg = document.getElementById("phonePreviewImg");
    if (phoneImg && i === 0) {
      phoneImg.src = e.target.result;
      const label = phoneImg.nextElementSibling;
      if (label) label.textContent = "AFTER";
    }
    render();
  };
  reader.readAsDataURL(file);
}

function deletePhoto(i) {
  if (!localEdits[currentGroup].photos) localEdits[currentGroup].photos = [null,null,null];
  localEdits[currentGroup].photos[i] = null;
  render();
}

function slidePhoto(groupName, idx) {
  const key = groupName.replace(/ /g, "_");
  const slider = document.getElementById("slider-" + key);
  if (!slider) return;
  const imgs = slider.querySelectorAll("img");
  const dots = slider.querySelectorAll(".slide-dot");
  imgs.forEach((img, i) => { img.style.opacity = i === idx ? "1" : "0"; });
  dots.forEach((dot, i) => { dot.classList.toggle("active", i === idx); });
}

function escHtml(str) {
  if (!str) return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ===== INIT =====
startListening();
</script>
